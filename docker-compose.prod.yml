services:
  frontend:
    image: ethanbokame/e_groupe_landing_page-frontend:latest
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config: